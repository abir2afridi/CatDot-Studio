[package]
name = "desktop"
version = "0.1.0"
description = "CatDot Studio â€” AI-powered Android APK modding workspace"
authors = ["CatDot Studio"]
edition = "2021"

# Detach from the parent workspace so we can keep our own [profile.release].
[workspace]

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
catdot-core = { path = "../../../crates/catdot-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
