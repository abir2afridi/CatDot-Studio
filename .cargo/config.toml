# Cargo config for APK Forge AI workspace.
# TS_RS_EXPORT_DIR tells ts-rs where `#[ts(export)]` bindings land
# (single source of truth for IPC types: packages/shared-types/src/generated).
# `relative = true` resolves against this workspace root.
[env]
TS_RS_EXPORT_DIR = { value = "packages/shared-types/src/generated", relative = true }
