[workspace]
members = ["crates/catdot-core"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.44", features = ["process", "rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
regex = "1.11"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "system-proxy"] }
futures-util = "0.3.34"
